<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d0d0d"/>
  <!-- Motivo: prodotti sigillati, ancora chiusi nel cellophane -->
  <g fill="none" stroke="#2E5BFF" stroke-width="2">
    <rect x="770" y="140" width="140" height="200" rx="3"/>
    <rect x="930" y="140" width="140" height="200" rx="3"/>
    <rect x="770" y="360" width="140" height="200" rx="3" opacity="0.45"/>
    <rect x="930" y="360" width="140" height="200" rx="3" opacity="0.45"/>
  </g>
  <g stroke="#F9F9F9" stroke-width="2" opacity="0.28">
    <line x1="770" y1="196" x2="910" y2="196"/>
    <line x1="930" y1="196" x2="1070" y2="196"/>
    <line x1="770" y1="416" x2="910" y2="416"/>
    <line x1="930" y1="416" x2="1070" y2="416"/>
  </g>
  <rect x="770" y="140" width="140" height="200" fill="#2E5BFF" opacity="0.12"/>
  <text x="90" y="150" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="7" fill="#2E5BFF">02 — COLLEZIONISMO</text>
  <text x="90" y="360" font-family="'DM Serif Display',Georgia,'Times New Roman',serif" font-size="118" fill="#F9F9F9">Sealed.</text>
  <text x="90" y="428" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="28" font-weight="500" letter-spacing="4" fill="#767676">Prodotti Pokémon ancora chiusi</text>
  <rect x="90" y="500" width="64" height="2" fill="#2E5BFF"/>
  <text x="90" y="552" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="9" fill="#767676">SELEZIONE.</text>
</svg>
